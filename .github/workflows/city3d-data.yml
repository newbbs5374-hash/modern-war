name: city3d-data
on:
  push:
    branches: ['claude/project-thread-ay4caw']
    paths: ['scripts/gen_city3d.py', '.github/workflows/city3d-data.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - run: curl -sSfL -o kr.osm.pbf https://download.geofabrik.de/asia/south-korea-latest.osm.pbf && ls -la kr.osm.pbf
      - run: |
          osmium extract -b 126.90,37.49,127.08,37.60 --strategy smart kr.osm.pbf -o seoul.osm.pbf
          osmium tags-filter seoul.osm.pbf nwr/building w/highway=motorway,trunk,primary,secondary nwr/natural=water,wood w/waterway=riverbank nwr/leisure=park nwr/landuse=grass,forest -o f.osm.pbf
          osmium export -f geojsonseq f.osm.pbf -o seoul.geojsonseq
          wc -l seoul.geojsonseq
      - run: python scripts/gen_city3d.py seoul.geojsonseq
      - run: ls -la public/city3d && gzip -c public/city3d/seoul.json | wc -c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add public/city3d/seoul.json
          git commit -m "서울 3D 시험 자료(OpenStreetMap) 자동 생성" || exit 0
          git push
