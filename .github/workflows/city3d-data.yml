# 도시 3D 자료(OpenStreetMap) 만들기: scripts/city3d_cities.json 목록. 목록이 바뀌면 실행, Actions 탭에서 손으로도 실행.
name: city3d-data
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/city3d_cities.json', 'scripts/city3d_build.py']
  workflow_dispatch:
    inputs:
      only:
        description: '다시 만들 파일 이름들(쉼표). 비우면 아직 없는 것만'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - run: python scripts/city3d_build.py "${{ github.event.inputs.only }}"
      - run: ls -la public/city3d && du -sh public/city3d
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add public/city3d/*.json
          git commit -m "도시 3D 자료(OpenStreetMap) 자동 생성" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
