name: fetch city logos (임시, 받은 뒤 지움)
on:
  push:
    branches: [claude/project-thread-qt5yh5]
    paths: [.github/workflows/fetch-logos.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: mkdir -p src/assets/logos && python scripts/fetch_city_logos.py src/assets/logos
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add src/assets/logos
          git commit -m "도시 상징 그림 44장 받기(위키미디어 공용)" || echo nothing
          git push
